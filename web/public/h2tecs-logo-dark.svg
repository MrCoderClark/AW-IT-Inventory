      font-family="Inter, 'Segoe UI', system-ui, sans-serif"
      font-size="26"
      font-weight="800"
      letter-spacing="-1.2"
      fill="#ffffff"
    >H2</text>
    <rect x="17" y="46" width="22" height="3.4" rx="1.7" fill="#ffffff" opacity="0.55"/>
    <rect x="25" y="51.2" width="22" height="3.4" rx="1.7" fill="#ffffff" opacity="0.34"/>
  </g>
  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif">
    <text x="76" y="27" font-size="22" font-weight="800" letter-spacing="-0.3" fill="#F8FAFC">H2Tecs</text>
    <text x="76" y="50" font-size="15" font-weight="700" letter-spacing="0.6" fill="#CBD5E1">IT Inventory</text>
