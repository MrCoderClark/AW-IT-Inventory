<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 268 64" role="img" aria-label="H2Tecs IT Inventory">
  <defs>
    <linearGradient id="lk-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F6DF5"/>
      <stop offset="55%" stop-color="#3B54E0"/>
      <stop offset="100%" stop-color="#6C3FF0"/>
    </linearGradient>
    <linearGradient id="lk-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.10"/>
    </linearGradient>
    <clipPath id="lk-round">
      <rect x="0" y="0" width="64" height="64" rx="16" ry="16"/>
