[project]
name = "collector"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11,<4",
    "cryptography>=50.0.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pysnmp>=7.1.29",
    "pywinrm>=0.5.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
# The collector modules are top level (import config, import ingest), not a
# package, so put the collector dir on the path for the tests.
pythonpath = ["."]
testpaths = ["tests"]
