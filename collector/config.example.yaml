# OPUS collector config. Copy to config.yaml and adjust.
# Passwords are NOT stored here — each profile names an env var (see .env).

networks:
  - 192.168.70.0/24   # domain (incl. printers)
  - 192.168.72.0/24   # workgroup

ports:
  winrm: 5985
  smb: 445
  printer: 9100

snmp_community: public

# WinRM local-admin credential profiles. `username` uses `.\name` for a local
# account. Secrets come from the named environment variable.
profiles:
  - id: win10-infotech
    username: ".\\infotech"
    password_env: PW_WIN10_INFOTECH
  - id: wg-intech
    username: ".\\Intech"
    password_env: PW_WG_INTECH
  - id: ad-infotech
    username: ".\\Infotech"
    password_env: PW_AD_INFOTECH

# Which profiles to try per host, in order (first that authenticates wins).
rules:
  - match: { subnet: 192.168.72.0/24 }   # workgroup
    try: [wg-intech, win10-infotech]
  - match: { subnet: 192.168.70.0/24 }   # domain
    try: [ad-infotech, win10-infotech]
  - match: { any: true }                 # fallback: try everything
    try: [ad-infotech, win10-infotech, wg-intech]

concurrency: 64
connect_timeout: 0.6
winrm_timeout: 25
snmp_timeout: 2.0
output_dir: out

# Ingest (used with `scan --ingest`). Credentials come from .env
# (OPUS_CLIENT_ID / OPUS_CLIENT_SECRET) — created via aw-auth's
# `create_service_account`.
auth_url: http://127.0.0.1:8000      # aw-auth
ingest_url: http://localhost:3000    # web app

# Worker (spec 12): `uv run python main.py worker`. All optional — the defaults
# below apply if omitted. The worker account needs the scan:dequeue scope.
worker_poll_interval: 5.0            # seconds between manual-scan-queue polls
# The printer reachability schedule (spec 12): TCP-probe every printer at these
# times; the first also runs a full SNMP collect. Needs `apscheduler` installed.
schedule_times: ["08:00", "13:00", "18:00"]
# schedule_timezone: America/New_York  # default: the host's local zone
daily_snmp_time: "08:00"             # which daily check also does full SNMP
reachability_ports: [9100, 631, 515]
reachability_timeout: 1.5            # TCP connect timeout, seconds
reachability_retention_days: 365
